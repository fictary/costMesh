<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>差旅紀錄</title>
<style>
:root{--indent:24px;--bg:#fff;--ink:#1f2937;--mute:#6b7280;--line:#eceef2;--line2:#d1d5db;--acc:#2f7cf6;--steel:#5b82ad;--sage:#5f9a76;--ochre:#b8953a;--coral:#c8676a;--plum:#8a74a8;--teal:#4f9a9a;--navy:#3d5a80;--forest:#3f6e52;--umber:#7d6236;--wine:#8f4a55;--indigo:#55598f;--slate:#5b6672;--olive:#6b7536;--rust:#9a5a3c;--sumbg:#6f7680;--sumfg:#fff;--shadow:0 8px 30px rgba(15,23,42,.16);color-scheme:light;
--tint:color-mix(in srgb,var(--acc) 3.5%,var(--bg));--act:color-mix(in srgb,var(--acc) 9%,var(--bg));
--font:"Segoe UI","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111418;--ink:#e6e8eb;--mute:#9aa3ad;--line:#22272f;--line2:#363d47;--acc:#5b9bff;--steel:#7ea3cc;--sage:#7cba93;--ochre:#d2b25c;--coral:#e08a8c;--plum:#a893c6;--teal:#6fbcbc;--navy:#86a6d0;--forest:#86bc9c;--umber:#c9aa76;--wine:#d4909a;--indigo:#a3a7dc;--slate:#a4afbb;--olive:#b7c27f;--rust:#d99a7e;--sumbg:#4a5059;--sumfg:#f2f2f2;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#111418;--ink:#e6e8eb;--mute:#9aa3ad;--line:#22272f;--line2:#363d47;--acc:#5b9bff;--steel:#7ea3cc;--sage:#7cba93;--ochre:#d2b25c;--coral:#e08a8c;--plum:#a893c6;--teal:#6fbcbc;--navy:#86a6d0;--forest:#86bc9c;--umber:#c9aa76;--wine:#d4909a;--indigo:#a3a7dc;--slate:#a4afbb;--olive:#b7c27f;--rust:#d99a7e;--sumbg:#4a5059;--sumfg:#f2f2f2;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.sp{flex:1}.mute{color:var(--mute)}.small{font-size:11.5px}.hide,[hidden]{display:none!important}
.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--mute));flex:none}
/* header */
header.top{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line)}
.logo{width:22px;height:22px;color:var(--acc);flex:none}
h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib{border:0;background:none;color:var(--mute);cursor:help;padding:2px 4px;font-size:13px}
.sv{font-size:11.5px;color:var(--mute);white-space:nowrap}.sv.dirty{color:var(--ochre)}
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:28px;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on,.btn.pri{background:var(--act);border-color:var(--acc);color:var(--acc)}
.btn.pri{font-weight:600}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{border-color:var(--line2)}
.btn.warn{color:var(--coral)}
.btn:disabled{opacity:.45;cursor:default}
.lockb.locked{color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 55%,var(--line2))}
.lockb.open{color:var(--sage)}
.more-m{display:none}
/* tabs */
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);align-items:flex-end}
.tab{border:0;background:none;padding:8px 12px 6px;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
/* layout */
.app{display:flex;min-height:calc(100vh - 110px)}
aside.side{width:264px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:40px}
.side-h{display:flex;align-items:center;gap:4px;padding:8px 8px 6px 12px}
.side-h b{font-size:12px;color:var(--mute);font-weight:600}
.tlist{outline:none;flex:1}
.tlist:focus-visible{box-shadow:inset 0 0 0 1px var(--acc)}
.side-f{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
main{flex:1;min-width:0;padding:6px 14px 70px}
/* trip tree */
.trow{display:flex;align-items:center;gap:5px;padding:3px 8px 3px calc(6px + var(--depth)*var(--indent));cursor:pointer;min-height:30px;position:relative;user-select:none;
background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px var(--indent));background-size:calc(var(--depth)*var(--indent)) 100%;background-repeat:no-repeat;background-position:15px 0}
.trow:hover .tn{color:var(--acc)}
.trow.on{box-shadow:inset 3px 0 var(--acc)}.trow.on .tn{color:var(--acc);font-weight:650}
.trow.msel{box-shadow:inset 3px 0 var(--acc)}.trow.msel .tn{color:var(--acc);font-weight:650}
.trow .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tm{font-size:11px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.trow .fi{width:14px;height:14px;color:var(--mute);flex:none}
.trow .hdl{opacity:0}.trow:hover .hdl{opacity:.7}
.empty-s{padding:14px;color:var(--mute);font-size:12px}
/* toggles */
.tg{width:18px;height:18px;border:0;background:none;color:var(--mute);cursor:pointer;padding:0;font-size:10px;line-height:1;transition:transform .15s;flex:none;display:inline-grid;place-items:center;border-radius:4px}
.tg:hover{color:var(--acc)}
.tg[aria-expanded=true]{transform:rotate(90deg)}
.tg.no{visibility:hidden}
.hdl{cursor:grab;color:var(--mute);padding:0 2px;font-size:12px;touch-action:none;user-select:none}
/* trip bar */
.tripbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 0 4px}
.tname{font-size:17px;font-weight:650;border:1px solid transparent;background:none;padding:2px 5px;border-radius:6px;min-width:120px;max-width:100%}
.tname:hover,.tname:focus{border-color:var(--line2);outline:none}
.fld{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:12px;flex-wrap:wrap}
.fld b{color:var(--ink);font-variant-numeric:tabular-nums}
input.f,select.f,textarea.f{border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:3px 7px;min-height:28px;max-width:100%}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--acc)}
input.f.num{text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 7px;border:1px solid var(--line2);border-radius:10px;font-size:11.5px;line-height:18px;color:var(--mute);background:none;white-space:nowrap}
button.chip{cursor:pointer;min-height:22px}
.chip.on{color:var(--ink);border-color:var(--acc);background:var(--act)}
.chip.c0{border-style:dashed}
.chip.c1{color:var(--ochre);border-color:color-mix(in srgb,var(--ochre) 60%,var(--line2))}
.chip.c2{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 60%,var(--line2))}
.tagc{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line2))}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--tint);border:1px solid var(--line);border-radius:8px;margin:6px 0 8px}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line2);margin:0 2px}
/* grid (AW-form: no table backgrounds) */
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;outline:none}
.gwrap:focus-visible{border-color:var(--acc)}
table{border-collapse:collapse;width:max-content;min-width:100%}
table,thead,tbody,tfoot,tr,th,td{background:transparent!important;background-color:transparent!important}
th,td{padding:4px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line2);user-select:none}
th[data-col]{cursor:pointer}
th[data-col]:hover{color:var(--ink)}
th.num{text-align:right}
th.grp{color:var(--ink);text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
th.grp .gh{display:inline-flex;align-items:center;gap:3px}
th.stub,td.stub{color:var(--mute);text-align:center;border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:34px}
th.mh{text-align:center;color:var(--ink);border-left:1px solid var(--line)}
th.mh .dot{margin-right:4px}
th.csel{color:var(--acc);box-shadow:inset 0 -2px var(--acc)}
td.ma{border-left:1px solid var(--line);min-width:64px}
td.mw{color:var(--mute);font-size:11.5px;min-width:34px;text-align:center}
td.c-ck{width:46px;padding-left:4px;position:relative}
td.c-ck input{margin:0 0 0 2px;vertical-align:middle;accent-color:var(--acc);cursor:pointer}
td.c-desc{min-width:240px;max-width:420px}
td.c-desc .tree{display:flex;align-items:center;gap:3px;min-height:22px;padding-left:calc(var(--depth)*var(--indent));
background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px var(--indent));background-size:calc(var(--depth)*var(--indent)) 100%;background-repeat:no-repeat;background-position:9px 0}
td.c-desc .tx{overflow:hidden;text-overflow:ellipsis}
td.c-remark{min-width:160px;max-width:340px;overflow:hidden;text-overflow:ellipsis}
td.c-tags{max-width:220px;overflow:hidden}
td.c-tags .chip{margin-right:3px}
td{cursor:default}
.unl td{cursor:cell}
tr.r.has>td{font-weight:600}
tr.r.has td.unit,tr.r.has td.reb{color:var(--mute);font-weight:500}
tr.r.on>td:first-child,tr.r.msel>td:first-child{box-shadow:inset 3px 0 var(--acc)}
tr.r.msel>td{color:var(--acc);font-weight:600}
tr.r.sub>td:first-child{box-shadow:inset 2px 0 color-mix(in srgb,var(--acc) 40%,transparent)}
tr.r.sub>td.c-desc{box-shadow:inset 0 -1px color-mix(in srgb,var(--acc) 22%,transparent)}
td.cur{outline:1.5px solid var(--acc);outline-offset:-2px;border-radius:3px}
tr.r.anom>td{color:var(--coral)}
tr.r.anom{outline:1px dashed var(--coral);outline-offset:-1px}
tr.r.anom>td.c-ck::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(45deg,var(--coral) 0 3px,transparent 3px 6px)}
tr.r.ok>td.c-desc .tx{text-decoration:none}
.wd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ochre);margin-right:5px;vertical-align:middle}
.anx{color:var(--coral);font-weight:600;margin-right:6px}
.ph{color:var(--mute);font-style:italic;font-weight:400}
tfoot td{font-weight:650;border-top:1.5px solid var(--line2);border-bottom:0}
tfoot tr.ft2 td{color:var(--acc);font-weight:600;border-top:1px dashed var(--line2)}
tr.addrow td{color:var(--mute);cursor:pointer;border-bottom:0}
tr.addrow td:hover{color:var(--acc)}
.ed{width:100%;min-width:60px;border:1px solid var(--acc);border-radius:4px;padding:1px 5px;background:var(--bg);outline:none;font-weight:400}
.ed.num{text-align:right}
select.ed{padding:1px 2px}
.ed-date{min-width:130px}
tr.r .hdl{opacity:.25}tr.r:hover .hdl{opacity:.8}
td.c-ck .hdl{margin-right:1px}
#fview{padding:4px 0 10px}
#fview td.lkc{min-width:220px}
.mapt{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.ocrbar{width:100%!important;margin:6px 0}
/* batch bar */
.batch{position:sticky;bottom:40px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;border:1px solid var(--acc);border-radius:8px;background:var(--bg);margin-top:8px;box-shadow:var(--shadow);z-index:4}
.batch b{color:var(--acc)}
.dropline{position:fixed;height:2px;background:var(--acc);pointer-events:none;z-index:30;border-radius:2px}
/* summary */
.sumv{padding:8px 14px 80px;max-width:1280px}
.sfil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--tint);border:1px solid var(--line);border-radius:8px;margin:6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:4px 0 16px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:2px solid var(--c,var(--line2))}
.kpi span{display:block;font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:var(--mute)}
.sec{margin:18px 0 6px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.sec .mute{font-weight:400;font-size:12px}
.tbx{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bar{display:inline-block;width:150px;height:8px;vertical-align:middle;position:relative}
.bar i{display:block;height:100%;border-radius:4px;background:var(--steel);min-width:2px}
.bar.claim i{background:var(--sage)}
.lk{color:var(--ink);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--line2)}
.lk:hover{color:var(--acc);border-color:var(--acc)}
.sumv .tree{display:flex;align-items:center;gap:4px;padding-left:calc(var(--depth,0)*var(--indent))}
.neg{color:var(--coral)}.pos{color:var(--sage)}
/* dialogs */
.dlg-back{position:fixed;inset:0;background:color-mix(in srgb,#000 38%,transparent);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--bg);border:1px solid var(--line2);border-radius:12px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dlg.wide{width:min(960px,100%)}
.dlg h3{margin:0;padding:10px 14px;font-size:14px;background:var(--tint);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.dlg .bd{padding:12px 14px;overflow:auto}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg p{margin:0 0 10px}
.frm{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;font-size:12px;color:var(--mute)}
.frm .f{color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;margin:6px 0;cursor:pointer}
.err{color:var(--coral);min-height:18px;font-size:12px}
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;flex-wrap:wrap}
.lrow{display:flex;gap:6px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.note{border-left:3px solid var(--ochre);padding:6px 10px;margin:8px 0;color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.mapt select{min-width:84px}
.mapt td.used{color:var(--ink)}.mapt td.unused{color:var(--mute);text-decoration:line-through}
/* hint, tip, toast */
.hint{position:fixed;left:0;right:0;bottom:0;padding:5px 14px;font-size:11.5px;color:var(--mute);background:var(--tint);border-top:1px solid var(--line);z-index:6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint .m{display:none}
.tip{position:fixed;z-index:70;max-width:340px;padding:6px 9px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12px;pointer-events:none;white-space:pre-line;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:80;padding:7px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12.5px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.menu{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;min-width:180px}
.menu .btn{justify-content:flex-start;border-color:transparent}
.drawerb{display:none}
/* mobile */
@media (max-width:640px){
 .lbl,.hide-m{display:none!important}
 .more-m{display:inline-flex}
 header.top{padding:6px 10px;gap:4px}
 .tabs{padding:0 8px}
 aside.side{position:fixed;inset:0;width:auto;z-index:40;background:var(--bg);transform:translateX(-102%);transition:transform .2s;border-right:0;overflow:auto}
 body.drawer aside.side{transform:none}
 .drawerb{display:inline-flex}
 main{padding:4px 10px 70px}
 .tripbar{gap:6px 10px}
 .tname{font-size:15px;width:100%}
 .dlg-back{padding:0}
 .dlg,.dlg.wide{width:100%;height:100%;max-height:none;border-radius:0}
 .dlg h3{border-radius:0}
 .hint .d{display:none}.hint .m{display:inline}
 .cols2,.grid2{grid-template-columns:1fr}
 .sumv{padding:6px 10px 80px}
 .kpis{grid-template-columns:1fr 1fr}
 .kpi b{font-size:18px}
 .bar{width:70px}
 #fq{flex:1;min-width:120px}
}
.gsec{flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;font-weight:400}
.seg button{border:0;border-left:1px solid var(--line2);background:none;padding:2px 10px;font:inherit;font-size:12px;color:var(--mute);cursor:pointer;min-height:24px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{color:var(--acc);font-weight:650;background:color-mix(in srgb,var(--acc) 9%,var(--bg))}
.gsec .btn{min-height:24px;font-size:12px;font-weight:400}
.glg{display:inline-flex;gap:10px;font-size:11.5px;font-weight:400;color:var(--mute);flex-wrap:wrap}
.glg>span{display:inline-flex;align-items:center;gap:4px}
.gwrap{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:min(70vh,640px);overscroll-behavior-x:contain}
.gbox{--L:230px;position:relative;width:calc(var(--L) + var(--W));min-width:100%}
.gh,.grw{display:flex;position:relative}
.gh{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line2)}
.gl{position:sticky;left:0;z-index:3;flex:none;width:var(--L);box-sizing:border-box;background:var(--bg);border-right:1px solid var(--line2);padding:0 8px;display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.gh .gl{z-index:6;font-size:12px;font-weight:650}
.gl .tree{min-width:0;overflow:hidden}
.gn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gr{position:relative;flex:none;width:var(--W);height:30px}
.gh .gr{height:44px}
.grw{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.gk{position:absolute;box-sizing:border-box;border-left:1px solid var(--line);font-size:11px;color:var(--mute);padding:0 4px;overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.gk.t1{top:0;height:20px;color:var(--ink);font-weight:600}
.gk.t2{top:20px;height:24px;border-top:1px solid var(--line)}
.gk.we{color:color-mix(in srgb,var(--coral) 70%,var(--mute))}
.gk i{font-style:normal;font-size:9.5px;opacity:.8}
.g-day .gk.t2{justify-content:center;padding:0;flex-direction:column;line-height:11px}
.gtd{position:absolute;top:2px;transform:translateX(-50%);font-size:10px;color:var(--coral);font-weight:650;background:var(--bg);padding:0 3px;z-index:2;line-height:16px}
.gbg{position:absolute;left:var(--L);top:45px;bottom:0;width:var(--W);pointer-events:none;z-index:0}
.gbg i{position:absolute;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.gbg i.we{background:color-mix(in srgb,var(--line) 45%,transparent)}

  has(a,i){return i+1<a.length&&a[i+1].depth>a[i].depth},
  parentIdx(a,i){for(let j=i-1;j>=0;j--)if(a[j].depth<a[i].depth)return j;return -1},
  ancestors(a,i){const r=[];let p=TR.parentIdx(a,i);while(p>=0){r.push(p);p=TR.parentIdx(a,p)}return r},
  vis(a){const r=[];let hide=Infinity;for(let i=0;i<a.length;i++){const x=a[i];if(x.depth>hide)continue;hide=Infinity;r.push(i);if(x.collapsed&&TR.has(a,i))hide=x.depth}return r},

        if(x.depth===0)continue;

      }

  },
  remove(a,ids){const set=new Set();TR.tops(a,ids).forEach(id=>TR.subtree(a,id).forEach(x=>set.add(x)));let n=0;for(let i=a.length-1;i>=0;i--)if(set.has(a[i].id)){a.splice(i,1);n++}TR.norm(a);return n},
  norm(a){for(let i=0;i<a.length;i++){const x=a[i];let d=Math.max(0,x.depth|0);const lim=i?a[i-1].depth+(canParent(a[i-1])?1:0):0;if(d>lim)d=lim;x.depth=d}return a}

const fltActive=()=>!!flt.q||fxOn('data');
function rowMatch(t,r,g){
  if(fxOn('data')&&(g.has||!fxMatch('data',{t,r,g})))return false;
  if(flt.q){const q=flt.q.toLowerCase(),c=catById(g.cat),p=memberById(g.payer);
    const hay=[r.desc,r.remark,g.tags.join(' '),c&&c.name,p&&p.name,r.date,fmtD(r.date)].join(' ').toLowerCase();
    if(!q.split(/\s+/).filter(Boolean).every(w=>hay.includes(w)))return false}
  return true;
}
function visRows(t,c){
  const a=t.rows;
  if(!fltActive())return{idx:TR.vis(a),pass:null};
  const show=new Set,pass=new Set;
  for(let i=0;i<a.length;i++){const r=a[i],g=c.ag.get(r.id);if(!rowMatch(t,r,g))continue;
    show.add(i);TR.ancestors(a,i).forEach(p=>show.add(p));
    const e=TR.end(a,i);for(let j=i;j<e;j++){show.add(j);if(!TR.has(a,j))pass.add(a[j].id)}}
  return{idx:[...show].sort((x,y)=>x-y),pass};
}

const ORDER=['ck','date','cat','desc','amt','unit','reb','qty','base','cur','claim','payer','@m','tags','remark'];
const COLN={ck:'✓',date:'日期',cat:'分類',desc:'項目 Description',unit:'單價',reb:'Rebate',qty:'數量',amt:'金額 $',cur:'幣別',base:'',claim:'報支',payer:'付款人','@m':'👤',tags:'標籤',remark:'備註 REMARK'};
const NUMK=new Set(['unit','reb','qty','amt','base']);
const colName=k=>LB('col.'+k,k==='base'?db.settings.base+' 金額':COLN[k]);
let GV=null;
function gridLayout(){
  const gs=db.settings.ui.colGroups,seen=new Set,seg=[];
  for(const k of ORDER){const g=gs.find(x=>x.cols.includes(k));
    if(!g){seg.push({k});continue}
    if(seen.has(g.id))continue;seen.add(g.id);seg.push({g,cols:ORDER.filter(c=>g.cols.includes(c))})}
  return seg;
}
function flatCols(seg,mids){
  const out=[];
  const ex=k=>k==='@m'?mids.flatMap(m=>[{k:'w:'+m,m,ma:1},{k:'w:'+m,m,mw:1}]):[{k}];
  for(const s of seg){
    if(s.k){out.push(...ex(s.k));continue}
    const cols=s.cols.flatMap(ex);
    if(!cols.length||(s.g.collapsed&&s.cols[0]==='@m'))out.push({stub:s.g});
    else if(s.g.collapsed)out.push(...ex(s.cols[0]).map(c=>(c.g=s.g,c.gh=1,c)));
    else out.push(...cols.map(c=>(c.g=s.g,c)));
  }
  return out;
}

function rowHtml(t,r,g,FC,i){

    if(d.stub)return stubBar(d.stub,g.sh,g.base);

      case 'date':{if(!r.date)return '<td data-k="date">'+(g.date&&!has&&r.depth?'':'')+'</td>';const wd=mk(r.date).getDay();return '<td data-k="date">'+(wd===0||wd===6?'<span class="wd" data-tip="週末"></span>':'')+fmtD(r.date)+'</td>'}
      case 'cat':{const c=catById(g.cat);return '<td data-k="cat"'+(g.icat?' class="mute"':'')+'>'+(c?catDot(c)+' '+esc(c.name):'')+'</td>'}
      case 'desc':{const mk_=g.iss.length?'<span class="anx"'+(g.anom?'':' style="color:var(--ochre)"')+' data-tip="'+esc(iss)+'">!</span>':'';
        return '<td class="c-desc" data-k="desc"><div class="tree" style="--depth:'+r.depth+'"><button class="tg'+(has?'':' no')+'" data-rtg tabindex="-1" aria-expanded="'+(has&&!r.collapsed)+'" aria-label="收合／展開">▸</button>'+mk_+'<span class="tx">'+(r.desc?esc(r.desc):'<span class="ph">（未命名）</span>')+'</span></div></td>'}

      case 'reb':return '<td class="num reb" data-k="reb">'+(has?(g.reb&&!g.mixed?fc(g.reb,g.cur):''):(r.reb?fc(r.reb,g.cur):''))+'</td>';

const fmtW=v=>{v=num(v);return v?String(+v.toFixed(3)):'0'};
function pruneSel(){
  const t=trip();const vs=new Set(VIS);
  for(const id of [...G.sel])if(!vs.has(id))G.sel.delete(id);
  if(t&&G.focus&&!vs.has(G.focus)){const i=TR.idx(t.rows,G.focus);let nf=null;if(i>=0){const an=TR.ancestors(t.rows,i);nf=an.map(p=>t.rows[p].id).find(id=>vs.has(id))||null}G.focus=nf}
  if(G.anchor&&!vs.has(G.anchor))G.anchor=G.focus;
  for(const id of [...S.sel])if(!tripById(id))S.sel.delete(id);
}
function paintGrid(){
  const t=trip();if(!t)return;
  let subSet=new Set;
  if(G.focus){const i=TR.idx(t.rows,G.focus);if(i>=0&&TR.has(t.rows,i))TR.subtree(t.rows,G.focus).slice(1).forEach(id=>subSet.add(id))}
  $$('#grid tr.r').forEach(tr=>{const id=tr.dataset.id;tr.classList.toggle('on',id===G.focus);tr.classList.toggle('msel',G.sel.has(id));tr.classList.toggle('sub',subSet.has(id))});
  $$('#grid td.cur').forEach(td=>td.classList.remove('cur'));
  if(G.focus){const tr=$('#grid tr.r[data-id="'+G.focus+'"]');if(tr){const tds=$$('td[data-k="'+curKey+'"]',tr);const td=tds[tds.length-1];if(td)td.classList.add('cur')}}

/* ---------- grid keyboard ---------- */
function gridKey(e){
  const t=trip();if(!t)return;const k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(k==='Tab'){if(e.target!==gw||!G.focus)return;e.preventDefault();indentSel(e.shiftKey?-1:1);return}
  if(k==='Escape'){if(G.sel.size||colSel.size){G.sel.clear();colSel.clear();paintGrid();renderBatch()}else gw.blur();return}
  if(ctrl&&k.toLowerCase()==='a'){e.preventDefault();VIS.forEach(id=>G.sel.add(id));if(!G.focus)G.focus=VIS[0];paintGrid();renderBatch();toast('已選取 '+G.sel.size+' 列（可見列）');return}
  if(ctrl&&k==='Enter'){e.preventDefault();addRowAfter(G.focus);return}
  if(ctrl&&k.toLowerCase()==='c'){const s=String(window.getSelection()||'');if(s)return;e.preventDefault();copyRows();return}
  if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();const d=k==='ArrowUp'?-1:1;if(e.altKey)moveRows(d);else moveFocus(d,e.shiftKey);return}
  if(k==='Home'||k==='End'){e.preventDefault();if(ctrl){G.sel.clear();G.focus=k==='Home'?VIS[0]:VIS[VIS.length-1];paintGrid();renderBatch();scrollCur()}else{curKey=k==='Home'?NAVK[0]:NAVK[NAVK.length-1];paintGrid();scrollCur()}return}
  if(!G.focus){if(VIS.length&&(k==='Enter'||k===' ')){e.preventDefault();G.focus=VIS[0];paintGrid()}return}
  const i=TR.idx(t.rows,G.focus),r=t.rows[i],has=i>=0&&TR.has(t.rows,i);
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();
    if(curKey==='desc'&&has&&!e.shiftKey){if(k==='ArrowLeft'&&!r.collapsed){setCollapse(r,true);return}if(k==='ArrowRight'&&r.collapsed){setCollapse(r,false);return}}
    moveCol(k==='ArrowLeft'?-1:1);return}
  if(k==='Enter'||k==='F2'){e.preventDefault();startEdit(G.focus,curKey);return}
  if(k===' '){e.preventDefault();if(curKey==='ck')toggleOk(G.focus);else if(curKey==='claim')cycleClaim(G.focus);else if(has)setCollapse(r,!r.collapsed);return}
  if(k==='Delete'){e.preventDefault();if(ctrl||e.shiftKey||G.sel.size>1)deleteRows(selIds());else clearCell();return}
  if(k==='Backspace'){e.preventDefault();clearCell();return}
  if(k.length===1&&!ctrl&&!e.altKey){e.preventDefault();startEdit(G.focus,curKey,['cat','cur','claim','payer'].includes(curKey)?null:k);return}
  if(e.keyCode===229&&!ctrl)startEdit(G.focus,curKey,'');
}
/* ---------- Alt+Q (block collapse) ---------- */
function blockToggle(a,i,nameOf){
  const g=TR.has(a,i)?i:TR.parentIdx(a,i);if(g<0)return null;
  const e=TR.end(a,g),gs=[];for(let j=g;j<e;j++)if(TR.has(a,j))gs.push(j);
  const open=gs.some(j=>!a[j].collapsed);gs.forEach(j=>a[j].collapsed=open);
  return{name:nameOf(a[g]),n:gs.length,col:open,id:a[g].id};
}
function toggleAllTree(a){const gs=a.map((x,i)=>i).filter(i=>TR.has(a,i));if(!gs.length)return null;const open=gs.some(j=>!a[j].collapsed);gs.forEach(j=>a[j].collapsed=open);return{n:gs.length,col:open}}
function altQ(){
  let a,id,nameOf,side=false;
  if(hover&&hover.type==='trip'){a=db.trips;id=hover.id;nameOf=x=>x.name;side=true}
  else if(hover&&hover.type==='row'){a=trip().rows;id=hover.id;nameOf=x=>x.desc||'（未命名）'}
  else if(zone==='side'&&curTrip){a=db.trips;id=curTrip;nameOf=x=>x.name;side=true}
  else{const t=trip();if(!t){toast('沒有可收合的區塊');return}a=t.rows;id=G.focus;nameOf=x=>x.desc||'（未命名）'}
  let res;
  if(id){const i=TR.idx(a,id);res=i>=0?blockToggle(a,i,nameOf):null;if(!res){toast('此列不屬於任何群組');return}
    toast('已'+(res.col?'收合':'展開')+'『'+res.name+'』整個區塊（'+res.n+' 個群組）');
    if(!side&&res.col&&G.focus){const t=trip(),fi=TR.idx(t.rows,G.focus);if(fi>=0&&TR.ancestors(t.rows,fi).some(p=>t.rows[p].id===res.id))G.focus=res.id}}
  else{res=toggleAllTree(a);if(!res){toast('沒有可收合的群組');return}toast('已全部'+(res.col?'收合':'展開')+'（'+res.n+' 個群組）')}
  saveView();side?renderSide():renderGrid();
}
/* ---------- column groups (Alt+Shift+→ / ←) ---------- */
function colClick(th,e){
  if(th.classList.contains('grp')){const g=db.settings.ui.colGroups.find(x=>x.id===th.dataset.g);if(!g)return;colSel=new Set(g.cols.filter(c=>c!=='@m'));paintGrid();return}
  const k=th.dataset.col;if(!k||k==='@m'||k==='ck')return;
  const ctrl=e.ctrlKey||e.metaKey;
  if(e.shiftKey&&colAnchor){const i=ORDER.indexOf(colAnchor),j=ORDER.indexOf(k);if(!ctrl)colSel.clear();ORDER.slice(Math.min(i,j),Math.max(i,j)+1).filter(c=>c!=='@m'&&c!=='ck').forEach(c=>colSel.add(c))}
  else if(ctrl){colSel.has(k)?colSel.delete(k):colSel.add(k);colAnchor=k}
  else{if(colSel.size===1&&colSel.has(k))colSel.clear();else colSel=new Set([k]);colAnchor=k}
  paintGrid();
  if(colSel.size)toast('已選 '+colSel.size+' 欄：Alt+Shift+→ 組成群組 ・ Alt+Shift+← 解除群組');
}
function groupCols(){
  if(!colSel.size){toast('先點選欄標題（Ctrl／Shift 可多選），再按 Alt+Shift+→ 建立欄群組');return}
  const gs=db.settings.ui.colGroups,cols=ORDER.filter(c=>colSel.has(c));
  gs.forEach(g=>{if(!g.lock)g.cols=g.cols.filter(c=>!colSel.has(c))});
  db.settings.ui.colGroups=gs.filter(g=>g.lock||g.cols.length);
  let n=1;while(db.settings.ui.colGroups.some(g=>g.name==='群組 '+n))n++;
  db.settings.ui.colGroups.push({id:uid(),name:'群組 '+n,cols,collapsed:false});
  colSel.clear();saveView();renderGrid();toast('已建立欄群組「群組 '+n+'」（Ctrl+右鍵群組標題可改名；雙擊表頭可收合）');
}
function ungroupCols(){
  if(!colSel.size){toast('先點選欄標題或群組標題，再按 Alt+Shift+← 解除群組');return}
  let n=0;db.settings.ui.colGroups.forEach(g=>{if(g.lock)return;const b=g.cols.length;g.cols=g.cols.filter(c=>!colSel.has(c));n+=b-g.cols.length});
  db.settings.ui.colGroups=db.settings.ui.colGroups.filter(g=>g.lock||g.cols.length);
  colSel.clear();saveView();renderGrid();toast(n?'已解除 '+n+' 欄的群組':'選取的欄不在任何群組內');
}
/* ---------- drag (hold ⋮⋮ on the first column) ---------- */
let drag=null;
const dropLine=()=>{let d=$('#dropline');if(!d){d=document.createElement('div');d.id='dropline';d.className='dropline';d.hidden=true;document.body.appendChild(d)}return d};
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.hdl[data-drag]');if(!h||e.button!==0)return;
  const isRow=h.dataset.drag==='row',host=isRow?h.closest('tr.r'):h.closest('.trow');if(!host)return;
  if(!canEdit()){askUnlock();return}
  const id=isRow?host.dataset.id:host.dataset.tid,set=isRow?G.sel:S.sel;
  drag={isRow,ids:set.has(id)?[...set]:[id],x:e.clientX,y:e.clientY,on:false,tgt:null,where:null};
  e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4)return;drag.on=true;
  const el=document.elementFromPoint(e.clientX,e.clientY),host=el&&el.closest(drag.isRow?'#grid tr.r':'#tlist .trow'),dl=dropLine();
  if(!host){drag.tgt=null;dl.hidden=true;return}
  const id=drag.isRow?host.dataset.id:host.dataset.tid,rc=host.getBoundingClientRect(),y=(e.clientY-rc.top)/rc.height;
  let where=y<.28?'before':y>.72?'after':'child';
  if(!drag.isRow&&where==='child'&&tripById(id).kind!=='folder')where=y<.5?'before':'after';
  drag.tgt=id;drag.where=where;
  const dep=drag.isRow?(rowOf(trip(),id)||{}).depth||0:tripById(id).depth;
  const lx=rc.left+28+(dep+(where==='child'?1:0))*24;
  Object.assign(dl.style,{left:lx+'px',width:Math.max(60,rc.right-lx)+'px',top:(where==='before'?rc.top-1:rc.bottom-1)+'px'});dl.hidden=false;
});
document.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;dropLine().hidden=true;if(!d.on||!d.tgt)return;
  if(d.isRow){const t=trip();if(!act(()=>TR.move(t.rows,d.ids,d.tgt,d.where)))toast('無法移到這裡')}
  else if(!act(()=>TR.move(db.trips,d.ids,d.tgt,d.where)))toast('無法移到這裡（出差只能放進資料夾）');
});

function openTrip(id){const x=tripById(id);if(!x)return;curTrip=id;G.sel.clear();G.focus=null;G.anchor=null;colSel.clear();if(editing)editing=null;tab='data';renderAll();if(matchMedia('(max-width:640px)').matches)document.body.classList.remove('drawer')}
tl.addEventListener('mousedown',e=>{
  zone='side';if(e.button!==0)return;const tw=e.target.closest('.trow');if(!tw||e.target.closest('[data-ttg],.hdl'))return;
  const id=tw.dataset.tid,ctrl=e.ctrlKey||e.metaKey,vis=TR.vis(db.trips).map(i=>db.trips[i].id);
  if(ctrl||e.shiftKey){e.preventDefault();
    if(e.shiftKey){const a=vis.indexOf(S.anchor||curTrip),b=vis.indexOf(id);if(!ctrl)S.sel.clear();if(a>=0&&b>=0)vis.slice(Math.min(a,b),Math.max(a,b)+1).forEach(x=>S.sel.add(x));else S.sel.add(id)}
    else{if(!S.sel.size&&curTrip&&curTrip!==id)S.sel.add(curTrip);S.sel.has(id)?S.sel.delete(id):S.sel.add(id);S.anchor=id}
    renderSide();return}
  S.sel.clear();S.anchor=id;if(id!==curTrip)openTrip(id);else renderSide();
  setTimeout(()=>tl.focus({preventScroll:true}));

tl.addEventListener('click',e=>{const b=e.target.closest('[data-ttg]');if(!b)return;const x=tripById(b.closest('.trow').dataset.tid),i=TR.idx(db.trips,x.id);if(TR.has(db.trips,i)){x.collapsed=!x.collapsed;saveView();renderSide()}});
tl.addEventListener('focus',()=>{zone='side'});
function sideKey(e){
  const a=db.trips,vis=TR.vis(a).map(i=>a[i].id),k=e.key,ctrl=e.ctrlKey||e.metaKey;if(!vis.length)return;
  let i=vis.indexOf(curTrip);
  if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();const j=Math.max(0,Math.min(vis.length-1,(i<0?0:i)+(k==='ArrowUp'?-1:1)));
    if(e.shiftKey){if(!S.anchor)S.anchor=curTrip;const p=vis.indexOf(S.anchor);S.sel.clear();vis.slice(Math.min(p,j),Math.max(p,j)+1).forEach(x=>S.sel.add(x))}else{S.sel.clear();S.anchor=vis[j]}
    const keep=new Set(S.sel);openTrip(vis[j]);keep.forEach(x=>S.sel.add(x));renderSide();tl.focus();return}
  const x=tripById(curTrip);if(!x)return;const xi=TR.idx(a,x.id),has=TR.has(a,xi);
  if(k==='Tab'){e.preventDefault();const ids=S.sel.size?[...S.sel]:[x.id];if(!canEdit()){askUnlock();return}if(!act(()=>TR.indent(a,ids,e.shiftKey?-1:1)))toast(e.shiftKey?'已在最上層':'只能縮排到資料夾底下');tl.focus();return}
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();if(has&&(k==='ArrowLeft')!==x.collapsed){x.collapsed=k==='ArrowLeft';saveView();renderSide()}else if(k==='ArrowLeft'&&x.depth){const p=TR.parentIdx(a,xi);openTrip(a[p].id);tl.focus()}return}
  if(k==='Enter'){e.preventDefault();if(x.kind==='trip'){gw.focus();zone='grid'}else{x.collapsed=!x.collapsed;saveView();renderSide()}return}
  if(k==='Delete'){e.preventDefault();delTrips(S.sel.size?[...S.sel]:[x.id]);return}
  if(ctrl&&k.toLowerCase()==='a'){e.preventDefault();vis.forEach(v=>S.sel.add(v));renderSide();return}
  if(k==='Escape'){if(S.sel.size){S.sel.clear();renderSide()}else tl.blur();return}
  if(k==='F2'){e.preventDefault();renameAt(tl.querySelector('.trow.on')||tl)}
}
function insertTripItem(item){
  const a=db.trips,cur=tripById(curTrip),i=cur?TR.idx(a,cur.id):-1;
  if(i<0){a.push(item);return}
  if(cur.kind==='folder'){item.depth=cur.depth+1;cur.collapsed=false;a.splice(TR.end(a,i),0,item)}else{item.depth=cur.depth;a.splice(TR.end(a,i),0,item)}
}
$('#addTrip').addEventListener('click',()=>{let id;if(act(()=>{const t=newTrip({start:iso(new Date())});t.end=t.start;t.wd=1;t.auto='end';insertTripItem(t);id=t.id})){openTrip(id);const n=$('#tripbar .tname');if(n){n.focus();n.select()}}});
$('#addFolder').addEventListener('click',()=>{let id;if(act(()=>{const f={id:uid(),kind:'folder',name:'新資料夾',depth:0,collapsed:false};insertTripItem(f);id=f.id})){openTrip(id);const n=$('#tripbar .tname');if(n){n.focus();n.select()}}});
function delTrips(ids){
  const a=db.trips,all=new Set;TR.tops(a,ids).forEach(id=>TR.subtree(a,id).forEach(x=>all.add(x)));
  const nTrip=[...all].filter(id=>tripById(id).kind==='trip').length,first=tripById(ids[0]);
  if(!canEdit()){askUnlock();return}
  askConfirm('刪除'+(ids.length>1?' '+ids.length+' 個項目':'「'+first.name+'」')+'？','共 '+nTrip+' 趟出差及其明細會一起刪除。刪除後可用右鍵／Ctrl+Z 回覆。',()=>{
    const vis=TR.vis(a).map(i=>a[i].id);let nx=vis.find((v,j)=>j>vis.indexOf(ids[0])&&!all.has(v))||vis.find(v=>!all.has(v))||null;
    if(act(()=>{TR.remove(a,ids)})){S.sel.clear();openTrip(nx);toast('已刪除（右鍵可回覆）')}},'刪除');
}
function dupTrip(){const t=trip();if(!t)return;let nid;
  if(act(()=>{const c=clone(t);c.id=uid();c.name=t.name+'（複本）';c.status='plan';c.rows.forEach(r=>{r.id=uid();r.ok=false;r.sig=''});db.trips.splice(TR.idx(db.trips,t.id)+1,0,c);nid=c.id})){openTrip(nid);toast('已複製出差')}}

const tb=$('#tripbar');

/* ---------- keyboard dispatcher ---------- */
document.addEventListener('keydown',e=>{
  const tg=e.target,inField=!!(tg.closest&&tg.closest('input:not([type=checkbox]),textarea,select,[contenteditable=true]'));
  if(e.code==='KeyQ'&&e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){if(!inField&&!dlgOpen()){e.preventDefault();tab==='sum'?sumAltQ():tab==='data'&&altQ()}return}
  if(dlgOpen()){dlgKey(e);return}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyS'){e.preventDefault();saveFile(e.shiftKey);return}
  if(editing&&tg===editing.el){edKey(e);return}

const KPIB={n:'出差次數',days:'出差天數',spend:'總支出',open:'未入帳',hard:'異常'};
const KPIK=Object.keys(KPIB);
const KTY=[['cat','分類 支出合計'],['tag','標籤 支出合計'],['mem','成員 分攤合計'],['st','狀態 出差趟數']];
function kpiU(){const u=db.settings.ui;if(!Array.isArray(u.kpiC))u.kpiC=[];if(!u.kpiH||typeof u.kpiH!=='object')u.kpiH={};return u}
function kpiAll(){const u=kpiU();return ordOf(u.kpiO,KPIK.concat(u.kpiC.map(c=>c.k)))}
function kpiDefName(c){if(!c||!c.type)return '指標';
  if(c.type==='cat'){const x=c.ref?catById(c.ref):null;return (x?x.name:'（未分類）')+' 支出'}
  if(c.type==='tag')return '#'+c.ref;
  if(c.type==='mem'){const m=memberById(c.ref);return (m?m.name:'（已刪除成員）')+' 分攤'}
  if(c.type==='st')return (STATUS[c.ref]||['?'])[0]+' 趟數';return '指標'}
function kpiVal(c,R){
  if(c.type==='cat'||c.type==='tag'){let v=0,n=0;
    R.forEach(({t,c:cc})=>t.rows.forEach((r,i)=>{if(TR.has(t.rows,i))return;const g=cc.ag.get(r.id);if(!g||!g.inc)return;
      if(c.type==='cat'?(g.cat||'')===(c.ref||''):g.tags.includes(c.ref)){v+=g.base;n++}}));
    return [c.type==='cat'?'sage':'ochre',fb(v),n+' 筆',(c.type==='cat'?'分類':'標籤')+'「'+kpiDefName(c).replace(/ 支出$/,'')+'」的支出合計（換算 '+db.settings.base+'）']}
  if(c.type==='mem'){let s=0,p=0,n=0;R.forEach(({c:cc})=>{const x=cc.mem[c.ref];if(!x)return;s+=x.share;p+=x.paid;n++});
    return ['steel',fb(s),n+' 趟・已付 '+fb(p),'這位成員在篩選範圍內的分攤合計']}
  if(c.type==='st'){let n=0,d=0;R.forEach(({t,c:cc})=>{if(t.status===c.ref){n++;d+=cc.tot.days}});
    return [(STATUS[c.ref]||[0,'steel'])[1],n+' <small class="mute">趟</small>',d+' 天','狀態為「'+(STATUS[c.ref]||['?'])[0]+'」的出差趟數']}
  return ['steel','—','','']}
function kpiH(R,K,st,base){const u=kpiU();
  const B={
    n:['steel',K.n+' <small class="mute">趟</small>',Object.entries(st).map(([k,v])=>STATUS[k][0]+' '+v).join('・'),'篩選範圍內的出差趟數'],
    days:['teal',K.days+' <small class="mute">天</small>','人天 '+K.mdays,'人天＝每趟天數 × 參與人數'],
    spend:['plum',fb(K.spend),K.reb?'Rebate '+fb(K.reb):'換算 '+esc(base),'所有明細換算 '+base+' 後加總'],
    open:['ochre',fb(K.open),K.openN+' 趟尚未入帳','狀態不是「已入帳」的出差的支出合計'],
    hard:['coral',K.hard+' <small class="mute">項</small>','提醒 '+K.soft+'・未確認 '+K.unok,'金額為 0、未設定分攤、確認後被修改＝異常；缺收據、缺匯率、日期不在期間＝提醒']};
  const kt=(k,c,nm,v,sub,tip)=>'<div class="kpi" data-oi="'+k+'" data-kk="'+k+'" style="--c:var(--'+c+')" data-tip="'+esc((tip?tip+'\n':'')+'Ctrl+右鍵改名・Ctrl+拖曳調整順序・⚙ 顯示／隱藏')+'"><span data-lk="kpi.'+k+'" data-ld="'+esc(nm)+'">'+esc(LB('kpi.'+k,nm))+'</span><b>'+v+'</b><em>'+(sub||'&nbsp;')+'</em></div>';
  let t='';
  kpiAll().forEach(k=>{if(u.kpiH[k])return;
    if(B[k]){const x=B[k];t+=kt(k,x[0],KPIB[k],x[1],x[2],x[3]);return}
    const c=u.kpiC.find(z=>z.k===k);if(!c)return;const x=kpiVal(c,R);t+=kt(k,x[0],kpiDefName(c),x[1],x[2],x[3])});
  return '<div class="sec">'+bTg('kpi')+bT('kpi','📈 總覽')+'<span class="sp"></span><button class="btn ghost kset" data-kpiset data-tip="自訂總覽：顯示／隱藏、改名、排序、新增指標" aria-label="自訂總覽">⚙</button></div>'+
    '<div class="kpis" data-ord="kpi">'+(t||'<div class="kpi kpe mute small">所有指標都已隱藏，按右上 ⚙ 設定</div>')+'</div>'}
ORDH.kpi=k=>{const u=kpiU();u.kpiO=k.concat(kpiAll().filter(x=>!k.includes(x)));saveView();renderSum()};
function kpiDlg(){const u=kpiU();let O=kpiAll(),C=u.kpiC.map(c=>({...c}));const H={...u.kpiH},N={};
  const nm=k=>KPIB[k]||kpiDefName(C.find(c=>c.k===k));
  const refOpts=ty=>ty==='cat'?db.settings.categories.map(c=>[c.id,c.name]).concat([['','（未分類）']]):ty==='tag'?allTags().map(x=>[x,'#'+x]):ty==='mem'?db.settings.members.map(m=>[m.id,m.name]):Object.entries(STATUS).map(([k,[n]])=>[k,n]);

  dlg({title:'⚙ 自訂總覽',
    body:'<p class="mute small">勾選＝顯示；名稱可直接修改（空白＝預設）；↑↓ 調整順序（總覽上也可 Ctrl+拖曳）。</p><div id="kpl"></div>'+
      '<div class="kadd"><b class="small">＋ 新增指標</b><select class="f" id="kty">'+KTY.map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join('')+'</select><select class="f" id="kref"></select><button type="button" class="btn" id="kaddB">＋ 新增</button></div>',
    onOpen:el=>{EL=el;const draw=()=>{$('#kpl',el).innerHTML=rows()};
      const fillRef=()=>{const o=refOpts($('#kty',el).value);$('#kref',el).innerHTML=o.length?o.map(([v,n])=>'<option value="'+esc(v)+'">'+esc(n)+'</option>').join(''):'<option value="" disabled selected>（沒有項目）</option>'};
      draw();fillRef();$('#kty',el).addEventListener('change',fillRef);
      el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.closest('.ft'))return;
        if(b.id==='kaddB'){sync();const ty=$('#kty',el).value,sel=$('#kref',el),o=sel.options[sel.selectedIndex];if(!o||o.disabled){toast('沒有可選的項目');return}
          const k='c'+uid();C.push({k,type:ty,ref:sel.value});O.push(k);draw();toast('已加入「'+kpiDefName(C[C.length-1])+'」，按「套用」生效');return}
        const r=b.closest('.kprow');if(!r)return;sync();const k=r.dataset.k,i=O.indexOf(k);
        if(b.hasAttribute('data-kup')&&i>0){O.splice(i,1);O.splice(i-1,0,k)}
        else if(b.hasAttribute('data-kdn')&&i<O.length-1){O.splice(i,1);O.splice(i+1,0,k)}
        else if(b.hasAttribute('data-kdel')){O.splice(i,1);C=C.filter(c=>c.k!==k);delete H[k];delete N[k]}

    btns:[{t:'取消'},{t:'套用',pri:1,fn:()=>{sync();u.kpiO=O.slice();u.kpiC=C;u.kpiH={};O.forEach(k=>{if(H[k])u.kpiH[k]=1});
      u.lbl=u.lbl||{};Object.keys(u.lbl).forEach(x=>{if(x.startsWith('kpi.c')&&!O.includes(x.slice(4)))delete u.lbl[x]});
      O.forEach(k=>{if(N[k]==null)return;const v=N[k].trim(),d=nm(k);if(!v||v===d)delete u.lbl['kpi.'+k];else u.lbl['kpi.'+k]=v});
      saveView();renderSum();toast('已更新總覽')}}]})}

  PAL.length=PAL0;cp.forEach((h,i)=>{const k='u'+(i+1);PAL.push(k);PALN[k]='自訂 '+(i+1)});
  let st=$('#cpalS');if(!st){st=document.createElement('style');st.id='cpalS';document.head.appendChild(st)}
  const L=cp.map((h,i)=>'--u'+(i+1)+':'+h).join(';'),D=cp.map((h,i)=>'--u'+(i+1)+':color-mix(in srgb,'+h+' 70%,#fff)').join(';');
  st.textContent=cp.length?':root{'+L+'}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){'+D+'}}:root[data-theme=dark]{'+D+'}':''}
function addCP(hex){const u=db.settings.ui;u.cpal=u.cpal||[];let i=u.cpal.findIndex(x=>x.toLowerCase()===hex.toLowerCase());

  DEF_ORDER.forEach((k,i)=>{if(!n.includes(k))n.splice(Math.min(i,n.length),0,k)});
  const ci=n.indexOf('ck');if(ci>0){n.splice(ci,1);n.unshift('ck')}

function colMove(s,t,af,sel){const u=db.settings.ui,gs=u.colGroups,gOf=k=>gs.find(g=>g.cols.includes(k));
  let ks=s.g?ORDER.filter(c=>(gs.find(x=>x.id===s.g)||{cols:[]}).cols.includes(c)):[s.k];
  if(s.k&&sel&&sel.has(s.k)&&sel.size>1)ks=ORDER.filter(c=>sel.has(c));
  if(!ks.length)return;
  let tg=t.g?gs.find(x=>x.id===t.g):null;if(!tg&&t.k){const g=gOf(t.k);if(g&&g.lock)tg=g}
  let ak;if(tg){const cs=ORDER.filter(c=>tg.cols.includes(c)&&!ks.includes(c));if(!cs.length)return;ak=af?cs[cs.length-1]:cs[0]}else ak=t.k;
  if(!ak||ks.includes(ak))return;
  const rest=ORDER.filter(c=>!ks.includes(c));let i=rest.indexOf(ak)+(af?1:0);if(rest[0]==='ck'&&i<1)i=1;rest.splice(i,0,...ks);
  let msg='';
  if(!s.g){const dg=!tg&&t.k?gOf(t.k):null,before=ks.map(k=>(gOf(k)||{}).id).join();
    gs.forEach(g=>{if(!g.lock)g.cols=g.cols.filter(c=>!ks.includes(c))});if(dg&&!dg.lock)dg.cols.push(...ks);
    u.colGroups=gs.filter(g=>g.lock||g.cols.length);
    const after=ks.map(k=>(gOf(k)||{}).id).join();if(before!==after)msg=dg?'，並加入群組「'+dg.name+'」':'，並移出群組'}
  ORDER.splice(0,ORDER.length,...rest);u.colOrder=rest.slice();colSel.clear();saveView();touch();renderGrid();
  toast('已移動'+(s.g?'群組「'+(gs.find(x=>x.id===s.g)||{}).name+'」':ks.length>1?' '+ks.length+' 欄':'「'+colName(ks[0])+'」')+msg)}

const fhKey=()=>'fh:'+db.appId+':'+fileName();
async function saveFile(as){
  const html=buildHtml(db),name=fileName();let how='';
  if(window.showSaveFilePicker){
    try{
      if(!as&&!fileHandle){const h=await FHDB.get(fhKey());
        if(h&&h.queryPermission){let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});if(p==='granted')fileHandle=h}}
      if(as||!fileHandle){const o={suggestedName:name,types:[{description:'HTML 檔',accept:{'text/html':['.html','.htm']}}]};
        const prev=await FHDB.get(fhKey());if(prev)o.startIn=prev;
        fileHandle=await window.showSaveFilePicker(o)}
      const w=await fileHandle.createWritable();await w.write(new Blob([html],{type:'text/html'}));await w.close();how='已存檔：'+fileHandle.name;
      if(fileHandle.name===name)FHDB.put(fhKey(),fileHandle)}
    catch(e){if(e&&e.name==='AbortError')return;console.warn(e);fileHandle=null}}
  if(!how){download(name,html,'text/html');how='已下載 '+name+'，請用它覆蓋原本的檔案'}
  fileDirty=false;saveLocal();paintSave();toast(how);

  const allM=[...new Set(trips.flatMap(t=>CT(t).mids))].map(memberById).filter(Boolean);
  const gs=S.ui.colGroups||[],gOf=k=>gs.find(g=>g.cols.includes(k));
  const COLS=[['desc','項目 Description',34],['date','日期',12],['cat','分類',10],['unit','單價',11],['reb','Rebate',10],['qty','數量',7],['amt','金額',12],['cur','幣別',7],['base',base+' 金額',13],['claim','報支',7],['payer','付款人',9]]
    .concat(allM.map(m=>['s:'+m.id,m.name+' 分攤',12]),allM.map(m=>['w:'+m.id,m.name+' 權重',8]),[['tags','標籤',14],['remark','備註',22],['iss','提醒',20]]);
  const gk=k=>k.startsWith('s:')||k.startsWith('w:')?'@m':k;
  const colsX=COLS.map(([k,,w])=>{const g=gOf(gk(k));return{w,lvl:g?1:0,hidden:!!(g&&g.collapsed)}});
  const s2=[{c:[[S.title+'—明細（'+label+'）',X.b],[null],[null],['匯出 '+stamp,X.g]]}],merges=[];
  const gRow=[];let ci=0;while(ci<COLS.length){const g=gOf(gk(COLS[ci][0]));if(!g){gRow.push(null);ci++;continue}let cj=ci;while(cj+1<COLS.length&&gOf(gk(COLS[cj+1][0]))===g)cj++;
    gRow.push([g.name.replace(/^\S+\s/,'')||g.name,X.h]);for(let k=ci+1;k<=cj;k++)gRow.push(null);if(cj>ci)merges.push(xcol(ci)+'2:'+xcol(cj)+'2');ci=cj+1}
  s2.push({c:gRow},{c:COLS.map(c=>[c[1],X.h])});
  const ix=Object.fromEntries(COLS.map((c,i)=>[c[0],i]));
  const items=[];
  list.forEach(t=>{const lv=t.depth-d0;
    if(t.kind!=='trip'){const r=new Array(COLS.length).fill(null);r[0]=[t.name,X.bind(Math.min(7,lv))];items.push({lvl:lv,col:t.collapsed,c:r});return}
    const C=CT(t),z=C.tot,r=new Array(COLS.length).fill(null);
    r[0]=[t.name,X.bind(Math.min(7,lv))];r[ix.date]=[fmtP(t)];r[ix.base]=[z.base,mbb];r[ix.remark]=[[t.place,t.purpose].filter(Boolean).join('・'),X.g];
    C.mids.forEach(m=>{if(ix['s:'+m]!=null)r[ix['s:'+m]]=[C.mem[m].share,mbb]});items.push({lvl:lv,col:false,c:r});
    t.rows.forEach(rw=>{const g=C.ag.get(rw.id),L=lv+1+rw.depth,c=new Array(COLS.length).fill(null),bo=g.has;
      c[0]=[rw.desc||'',bo?X.bind(Math.min(7,L)):X.ind(Math.min(7,L))];
      c[ix.date]=[rw.date?fmtD(rw.date):''];const ca=catById(rw.cat);c[ix.cat]=[ca?ca.name:''];
      if(!bo){c[ix.unit]=[rw.unit==null?null:num(rw.unit),X.m2];c[ix.reb]=[rw.reb==null||!num(rw.reb)?null:num(rw.reb),X.m2];c[ix.qty]=[qtyOf(rw)];c[ix.amt]=[g.amt,X.m2];c[ix.claim]=[CLAIM[rw.claim]?CLAIM[rw.claim][0]:''];
        allM.forEach(m=>{const w=num(rw.w&&rw.w[m.id]);if(w&&ix['w:'+m.id]!=null)c[ix['w:'+m.id]]=[w]})}
      else if(!g.mixed)c[ix.amt]=[g.amt,X.bm2];
      c[ix.cur]=[g.cur||rw.cur||base];c[ix.base]=[g.base,bo?mbb:mb];const pm=memberById(rw.payer);c[ix.payer]=[pm?pm.name:''];
      C.mids.forEach(m=>{if(ix['s:'+m]!=null&&g.sh[m])c[ix['s:'+m]]=[g.sh[m],bo?mbb:mb]});
      c[ix.tags]=[rw.tags.join(', ')];c[ix.remark]=[rw.remark||''];c[ix.iss]=[g.iss.map(k=>ISS[k]).join('、'),X.g];
      items.push({lvl:L,col:rw.collapsed,c})})});
  let hideAt=Infinity;items.forEach((it,i)=>{const nx=items[i+1],has=nx&&nx.lvl>it.lvl;if(it.lvl>hideAt)it.hidden=true;else hideAt=Infinity;
    if(has&&it.col){it.collapsed=!it.hidden;if(hideAt===Infinity)hideAt=it.lvl}s2.push({lvl:Math.min(7,it.lvl),hidden:it.hidden,collapsed:it.collapsed&&has,c:it.c})});
  const det=sheetXml(s2,{cols:colsX,merges,fx:1,fy:3});
  const blob=xlsxBlob([{name:'總結',xml:sum1},{name:'明細',xml:det}]);
  download(baseName()+(scope==='cur'?'_'+label:'')+'_'+ymd()+'.xlsx',blob);toast('已匯出 Excel（可用左側 +／− 收合階層）');
}
const ymd=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())};
const baseName=()=>(db.settings.title||'差旅紀錄').replace(/[\\/:*?"<>|]/g,'_');
function fileName(){let n='';try{n=decodeURIComponent(location.pathname.split('/').pop()||'')}catch(e){}return /\.html?$/i.test(n)?n:baseName()+'.html'}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function exportCsv(){
  const t=trip();if(!t){toast('請先選擇一趟出差');return}
  const C=CT(t),ms=C.mids.map(memberById),q=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const L=[['出差','階層','日期','分類','項目','單價','Rebate','數量','金額','幣別',db.settings.base+' 金額','報支','付款人'].concat(ms.map(m=>m.name),['標籤','備註'])];
  t.rows.forEach(r=>{const g=C.ag.get(r.id),ca=catById(r.cat),pm=memberById(r.payer);
    L.push([t.name,r.depth,r.date,ca?ca.name:'','　'.repeat(r.depth)+(r.desc||''),g.has?'':r.unit??'',g.has?'':r.reb??'',g.has?'':qtyOf(r),g.has?'':g.amt,g.cur||r.cur||db.settings.base,g.base,g.has?'':(CLAIM[r.claim]||[''])[0],pm?pm.name:''].concat(ms.map(m=>g.has?'':num(r.w&&r.w[m.id])),[r.tags.join(' '),r.remark||'']))});
  download(baseName()+'_'+t.name+'.csv','﻿'+L.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已匯出 CSV');
}
function exportJson(){download(baseName()+'_備份_'+ymd()+'.json',JSON.stringify(db,null,1),'application/json');toast('已下載 JSON 備份（密碼只存雜湊值）')}
function importJson(){
  if(!canEdit()){askUnlock(importJson);return}
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;f.text().then(txt=>{let d;try{d=JSON.parse(txt)}catch(e){toast('不是有效的 JSON 檔');return}
    if(!d||!Array.isArray(d.trips)||!d.settings){toast('這不是差旅紀錄的備份檔');return}
    askConfirm('匯入備份？','會用「'+f.name+'」取代目前所有出差與設定（'+d.trips.filter(x=>x.kind==='trip').length+' 趟出差）。這個檔案的密碼維持不變；匯入後可按 Ctrl+Z 回覆。',()=>{
      const ok=act(()=>{const pw=db.settings.pw;migrate(d);db.trips=d.trips;db.settings=d.settings;db.settings.pw=pw});
      if(ok){const x=db.trips.find(t=>t.kind==='trip');curTrip=x?x.id:null;pruneSel();renderAll();toast('已匯入備份')}},'匯入')})};
  i.click();
}
function exportItems(){return[['📊 Excel：全部出差',()=>exportXlsx('all')],['📊 Excel：目前出差／資料夾',()=>exportXlsx('cur')],['🧾 CSV：目前出差明細',exportCsv],['🗄 JSON 備份',exportJson],['📄 另存 HTML 副本',()=>saveFile(true)]]}
/* ---------- save back into this HTML file ---------- */
function buildHtml(d){
  const j=JSON.stringify(d).replace(/</g,'\\u003c');
  return PRISTINE.replace(/(<script type="application\/json" id="tx-seed">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b)
    .replace(/<title>[\s\S]*?<\/title>/,()=>'<title>'+esc(d.settings.title||'差旅紀錄')+'</'+'title>');
}
async function saveFile(as){
  const html=buildHtml(db),name=fileName();let how='';
  if(window.showSaveFilePicker){
    try{if(as||!fileHandle)fileHandle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'HTML 檔',accept:{'text/html':['.html','.htm']}}]});
      const w=await fileHandle.createWritable();await w.write(new Blob([html],{type:'text/html'}));await w.close();how='已存檔：'+fileHandle.name}
    catch(e){if(e&&e.name==='AbortError')return;console.warn(e);fileHandle=null}}
  if(!how){download(name,html,'text/html');how='已下載 '+name+'，請用它覆蓋原本的檔案'}
  fileDirty=false;saveLocal();paintSave();toast(how);
}
function templateDlg(){
  const S=db.settings;
  dlg({title:'📄 產生空白範本',body:'<p class="mute">產生一份沒有出差資料的新 HTML 檔，傳給成員各自使用。每份檔案有自己的資料、暫存與密碼，彼此不會互相影響。</p>'+
    '<label class="frm">標題<input class="f" id="tt" value="'+esc(S.title)+'"></label>'+
    '<label class="chk"><input type="checkbox" id="tm" checked>保留成員名單（'+S.members.length+' 人）</label>'+
    '<label class="chk"><input type="checkbox" id="tc" checked>保留分類、幣別、匯率與報支規則</label>'+
    '<label class="chk"><input type="checkbox" id="tp">保留目前的編輯密碼（不勾＝新檔沒有密碼，由使用者自己設定）</label>',
    btns:[{t:'取消'},{t:'下載範本',pri:1,fn:el=>{const d=newDb(),N=d.settings;N.title=$('#tt',el).value.trim()||'差旅紀錄';N.desc=S.desc||'';
      if($('#tm',el).checked)N.members=clone(S.members);
      if($('#tc',el).checked){N.base=S.base;N.currencies=clone(S.currencies);N.categories=clone(S.categories);N.claimMode=S.claimMode;N.defClaim=S.defClaim}
      if($('#tp',el).checked)N.pw=clone(S.pw);
      N.ui.colGroups=clone(S.ui.colGroups);d.updatedAt=Date.now();
      download((N.title||'差旅紀錄').replace(/[\\/:*?"<>|]/g,'_')+'_空白範本.html',buildHtml(d),'text/html');toast('已下載空白範本')}}]});
}
/* ---------- theme ---------- */
const THN={auto:['◐','跟隨系統'],light:['☀','淺色'],dark:['☾','深色']};
let themeMem=null;
function applyTheme(){let t=lsGet('travelx-theme')||themeMem||'auto';if(!THN[t])t='auto';const r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const b=$('#themeb');if(b){b.textContent=THN[t][0];b.dataset.tip='主題：'+THN[t][1]+'（按一下切換 自動→淺色→深色）'}}
function cycleTheme(){const t=lsGet('travelx-theme')||themeMem||'auto',n={auto:'light',light:'dark',dark:'auto'}[t]||'auto';themeMem=n;lsSet('travelx-theme',n);applyTheme();toast('主題：'+THN[n][1])}
/* ---------- tooltip / toast / menu ---------- */
(()=>{const tip=$('#tip');let tT=0,cur=null;
  const hide=()=>{clearTimeout(tT);tip.hidden=true;cur=null};
  document.addEventListener('mouseover',e=>{if(lastPT==='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el===cur)return;hide();if(!el||!el.dataset.tip)return;cur=el;
    tT=setTimeout(()=>{if(!document.contains(el))return;tip.textContent=tipText(el);tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
      let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.bottom+6;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-6);tip.style.left=x+'px';tip.style.top=y+'px'},350)});
  document.addEventListener('mousedown',hide,true);window.addEventListener('scroll',hide,true);document.addEventListener('keydown',hide,true);
})();
let toastT=0;
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
let menuEl=null;
function openMenu(anchor,items){
  if(menuEl&&menuEl.anchor===anchor){closeMenu();return}closeMenu();
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  items.forEach(([t,fn])=>{const b=document.createElement('button');b.className='btn';b.setAttribute('role','menuitem');b.textContent=t;b.addEventListener('click',()=>{closeMenu();fn()});m.appendChild(b)});
  document.body.appendChild(m);const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-8),y=r.bottom+4;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-4);m.style.left=Math.max(8,x)+'px';m.style.top=y+'px';
  menuEl={m,anchor};const f=m.querySelector('button');if(f)f.focus({preventScroll:true});
  m.addEventListener('keydown',e=>{const bs=[...m.querySelectorAll('button')],i=bs.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();bs[(i+1)%bs.length].focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();e.stopPropagation();bs[(i-1+bs.length)%bs.length].focus()}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMenu();anchor.focus()}
    else if(e.key==='Tab')closeMenu();
    else if(e.key==='Enter'||e.key===' ')e.stopPropagation()});
}
function closeMenu(){if(menuEl){menuEl.m.remove();menuEl=null}}
function menuOpen(){return !!menuEl}
document.addEventListener('mousedown',e=>{if(menuEl&&!menuEl.m.contains(e.target)&&!menuEl.anchor.contains(e.target))closeMenu()},true);
window.addEventListener('resize',closeMenu);
window.addEventListener('beforeunload',e=>{if(fileDirty){e.preventDefault();e.returnValue=''}});
/* ---------- init ---------- */
(async()=>{
  load();applyTheme();
  try{await checkUnlock()}catch(e){unlocked=false}
  const f=db.trips.find(t=>t.kind==='trip');curTrip=f?f.id:(db.trips[0]||{}).id||null;
  renderAll();
  if(db.settings.pw&&!unlocked&&!ssGet(akey())){ssSet(akey(),'1');askUnlock()}
  if(loadMsg)toast(loadMsg);
})();
</script>
